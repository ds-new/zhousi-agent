apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-control-plane
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DIY_BIND_HOST
              value: "0.0.0.0"
            - name: DIY_ALLOW_INSECURE_DEV
              value: "false"
            - name: DIY_CONTROL_PLANE_PORT
              value: {{ .Values.service.port | quote }}
            - name: DIY_DATA_DIRECTORY
              value: /tmp/diy-data
            - name: DIY_OIDC_ISSUER
              value: {{ .Values.env.oidcIssuer | quote }}
            - name: DIY_OIDC_AUDIENCE
              value: {{ .Values.env.oidcAudience | quote }}
            - name: DIY_OIDC_JWKS_URL
              value: {{ .Values.env.oidcJwksUrl | quote }}
            - name: DIY_WEBHOOK_ALLOWED_ORIGINS
              value: {{ .Values.env.webhookAllowedOrigins | quote }}
            - name: DIY_EVOLUTION_URL
              value: {{ .Values.env.evolutionUrl | quote }}
            - name: DIY_EVOLUTION_INTERVAL_MS
              value: {{ .Values.env.evolutionIntervalMs | quote }}
            {{- range $key := list "DATABASE_URL" "DIY_PLATFORM_ADMIN_KEY" "DIY_EVOLUTION_INTERNAL_TOKEN" "DIY_TENANT_SERVICES" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "authSecretName is required" $.Values.authSecretName | quote }}
                  key: {{ $key }}
            {{- end }}

          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control-plane
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-control-plane
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
