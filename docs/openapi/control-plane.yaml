openapi: 3.1.0
info:
  title: DIY Agent Control Plane
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
  /tenants:
    post:
      summary: Create Tenant
  /workspaces:
    post:
      summary: Create Workspace
  /profiles:
    post:
      summary: Create Agent Profile
  /profiles/{profileId}/versions/{versionId}:
    get:
      summary: Pull pinned Profile snapshot for Data Plane sync
  /profiles/{profileId}/pin:
    post:
      summary: Pin Profile version after Pin Gate (fires profile.pinned webhook with snapshot)
  /tenants/{tenantId}/profile-sync:
    get:
      summary: List pinned profile snapshots for Enterprise Data Plane reconcile
  /sessions:
    post:
      summary: Create Session with scoped token
  /golden-tasks:
    post:
      summary: Register Golden Task
  /traces:
    post:
      summary: Ingest Eval Trace
  /profiles/{profileId}/traces:
    get:
      summary: List Eval Traces (90-day retention)
  /kb/documents:
    post:
      summary: Ingest document into Workspace internal KB (pgvector)
  /kb/search:
    post:
      summary: Hybrid KB search (internal vector + external MCP)
  /audit:
    get:
      summary: List tenant audit events
    post:
      summary: Append audit event (e.g. policy.ask_resolved from Data Plane)
  /webhooks:
    post:
      summary: Register tenant webhook endpoint
  /api-keys:
    post:
      summary: Create Tenant Admin API key (diy_sk_*)
  /workspace-members:
    post:
      summary: Assign Workspace RBAC role (admin/builder/user)
  /workspaces/{workspaceId}/policy:
    get:
      summary: Get workspace access policy
    put:
      summary: Update workspace access policy
  /evolution/runs/{runId}/approve:
    post:
      summary: Approve L2 evolution candidate
  /evolution/runs/{runId}/reject:
    post:
      summary: Reject L2 evolution candidate
  /evolution/runs:
    post:
      summary: Start Evolution Run
  /marketplace/skills:
    get:
      summary: List platform marketplace Skills
    post:
      summary: Publish marketplace Skill (platform admin)
  /marketplace/skills/{skillId}:
    get:
      summary: Get marketplace Skill by id
  /marketplace/subscriptions:
    get:
      summary: List tenant marketplace subscriptions
    post:
      summary: Subscribe tenant to marketplace Skill
  /marketplace/subscriptions/{skillId}:
    delete:
      summary: Unsubscribe tenant from marketplace Skill
