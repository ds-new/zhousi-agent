version = "0.1.0"
description = "GEPA/DSPy evolution sidecar for diy-agent platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gepa = ["gepa-ai", "dspy-ai"]

[build-system]
